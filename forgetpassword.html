<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Explore Egypt - Tourism Portal</title>

    <meta name="description" content="Recover your account password to access your personalized travel experience in Egypt.">
  
    <meta name="robots" content="noindex, follow"> 
  
    <link rel="canonical" href="https://pharaohslegacy.cloud/forgetpassword" />
  
    <meta property="og:title" content="Forgot Password | Explore Egypt" />
    <meta property="og:description" content="Reset your password to continue exploring Egypt’s landmarks, tours, and more." />
    <meta property="og:url" content="https://pharaohslegacy.cloud/forgetpassword" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pharaohslegacy.cloud/images/meta-tag-logo.jpg" />
  
    
  
    
    <script>
      fetch('https://pharaohslegacy.cloud/api/auth/profile', {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${sessionStorage.getItem('userData')}`
        }
      })
      .then((res) => {
        res.json();
        console.log(res);
        if(res.status === 200){
            window.location.href = 'index.html';
            return;
        }
      })
      
      .catch((error) => {
        
      });
    </script>
  <link rel="stylesheet" href="css/all.min.css" />
  <link rel="stylesheet" href="css/animate.min.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/toastr.min.css" />
  <link rel="stylesheet" href="css/forgetpassword.css" />
<link rel="shortcut icon" href="images/meta-tag-logo.jpg" type="image/x-icon">
  <!-- JS FILES  -->
  <script defer src="js/bootstrap.bundle.min.js"></script>
  <script defer src="js/jquery-3.7.1.min.js"></script>
  <script defer src="js/toastr.min.js"></script>
  <script defer src="js/forgetpassword.js"></script>

</head>

<body>
  <!-- Background animated elements -->
  <div class="background">
    <div class="pyramid animate__animated animate__fadeIn animate__slow animate__infinite animate__pulse"></div>
    <div class="pyramid animate__animated animate__fadeIn animate__slow animate__infinite animate__pulse"></div>
    <div class="pyramid animate__animated animate__fadeIn animate__slow animate__infinite animate__pulse"></div>
    <div class="ankh animate__animated animate__rotateIn animate__slow animate__infinite"></div>
    <div class="ankh animate__animated animate__rotateIn animate__slow animate__infinite"></div>
    <div class="ankh animate__animated animate__rotateIn animate__slow animate__infinite"></div>
    <div class="hieroglyph animate__animated animate__floating animate__slow animate__infinite"></div>
    <div class="hieroglyph animate__animated animate__floating animate__slow animate__infinite"></div>
    <div class="eye-of-horus animate__animated animate__pulse animate__slow animate__infinite"></div>
    <div class="scarab animate__animated animate__rotateIn animate__slow animate__infinite animate__reverse"></div>
  </div>

  <!-- Main content -->
  <div class="container animate__animated animate__fadeIn rounded-5">
    <h1 class="title animate__animated animate__fadeInDown">Password Recovery</h1>

    <!-- Stepper -->
    <div class="stepper animate__animated animate__fadeIn animate__delay-1s">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="step active" id="step-1">1</div>
      <div class="step" id="step-2">2</div>
      <div class="step" id="step-3">3</div>
    </div>

    <div class="form-container ">
      <!-- Step 1: Email Form -->
      <div class="form-step active animate__animated animate__fadeIn" id="email-form">
        <div class="mb-4">
          <label for="email" class="form-label">Enter Your Email</label>
          <input type="email" class="form-control text-white " id="email" placeholder="your.email@example.com" required>
          <div class="email-message d-flex align-items-center gap-2 text-danger d-none">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p class="email-input-message m-0 fs-6 fw-medium"></p>
          </div>
        </div>
        <div class="button-group">
          <div></div> <!-- Empty div for flex spacing -->
          <button type="button" id="email-next" class="btn btn-custom"><i
              class="fa-solid fa-spinner fa-spin d-none"></i><span class="d-block">Send Code</span></button>
        </div>
      </div>

      <!-- Step 2: Verification Code Form -->
      <div class="form-step animate__animated" id="code-form">
        <div class="mb-4">
          <label for="verification-code" class="form-label">Enter Verification Code</label>
          <input type="text" class="form-control text-white" id="verification-code" placeholder="Enter the 6-digit code"
            required>
          <div class="code-message d-flex align-items-center gap-2 text-danger d-none">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p class="code-input-message m-0 fs-6 fw-medium"></p>
          </div>
        </div>
        <div class="button-group">
          <button type="button" id="code-prev" class="btn btn-custom btn-previous">Back</button>
          <button type="button" id="code-next" class="btn btn-custom"><i
              class="fa-solid fa-spinner fa-spin d-none"></i><span class="d-block">Verify Code</span></button>
        </div>
      </div>

      <!-- Step 3: New Password Form -->
      <div class="form-step animate__animated" id="password-form">
        <div class="mb-4">
          <label for="new-password" class="form-label">New Password</label>
          <input type="password" class="form-control text-white" id="new-password" placeholder="Enter new password"
            required>
          <!-- <div class="error-message" id="password-error">Password must be at least 8 characters</div> -->
          <div class="password-message d-flex align-items-center gap-2 text-danger d-none">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p class="password-input-message m-0 fs-6 fw-medium"></p>
          </div>
        </div>
        <div class="mb-4">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control text-white" id="confirm-password"
            placeholder="Confirm new password" required>
          <!-- <div class="error-message" id="confirm-error">Passwords do not match</div> -->
          <div class="confirm-password-message d-flex align-items-center gap-2 text-danger d-none">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p class="confirm-password-input-message m-0 fs-6 fw-medium"></p>
          </div>
        </div>
        <div class="button-group">
          <button type="button" id="password-prev" class="btn btn-custom btn-previous">Back</button>
          <button type="button" id="submit-btn" class="btn btn-custom"><i
              class="fa-solid fa-spinner fa-spin d-none"></i><span class="d-block">Reset Password</span></button>
        </div>
      </div>

      <!-- Success Message -->
      <div class="success-message" id="success-message">
        <div class="success-icon animate__animated animate__pulse animate__infinite">☥</div>
        <h2>Password Reset Successfully</h2>
        <p>You can now log in with your new password</p>
      </div>
    </div>
  </div>




</body>

</html>
